<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2E7D32">
<title>Cardápio online — Outfood</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍕</text></svg>">
<link rel="stylesheet" href="/assets/styles.css">
<style>
  body{background:#F7F9F7}
  .shop{max-width:1000px;margin:0 auto;padding:0 14px 120px}
  .hero{background:linear-gradient(140deg,#1B5E20,#2E7D32);color:#fff;padding:26px 14px}
  .hero .inner{max-width:1000px;margin:0 auto}
  .hero h1{font-size:24px}
  .hero .badge{background:rgba(255,255,255,.16);color:#fff;border-color:transparent}
  .shop-grid{display:grid;grid-template-columns:1fr 330px;gap:18px;align-items:start;margin-top:18px}
  @media(max-width:900px){.shop-grid{grid-template-columns:1fr}.cart-panel{position:fixed;inset:auto 0 0 0;border-radius:14px 14px 0 0;max-height:74vh;overflow-y:auto;z-index:40;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
    .cart-panel.collapsed .cart-inner{display:none}}
  .cart-panel{position:sticky;top:14px}
  .dish{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--border);border-radius:12px;background:#fff;margin-bottom:9px;cursor:pointer}
  .dish:hover{border-color:var(--green);box-shadow:var(--shadow)}
  .dish .price{font-weight:700;color:var(--green-dk);white-space:nowrap}
</style>
</head>
<body>
<div class="hero"><div class="inner" id="hero"></div></div>
<div class="shop" id="app"><div class="loading">Carregando cardápio...</div></div>
<script type="module" src="/app/shop.js"></script>
</body>
</html>
